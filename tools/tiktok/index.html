<script>
"use strict";
(() => {
  const payload = JSON.parse(document.getElementById("encrypted-tool").textContent);
  const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
  const encode = value => btoa(String.fromCharCode(...new Uint8Array(value)));
  const storageKey = "nexta-tools-key:" + location.pathname;
  const form = document.getElementById("unlock-form");
  const password = document.getElementById("password");
  const remember = document.getElementById("remember");
  const button = document.getElementById("open-button");
  const error = document.getElementById("unlock-error");
  const forget = () => { try { localStorage.removeItem(storageKey); } catch {} };
  async function decrypt(key) {
    const bytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv: decode(payload.iv) }, key, decode(payload.ciphertext));
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }
  function open(html) {
    password.value = "";
    document.open();
    document.write(html);
    document.close();
  }
  form.addEventListener("submit", async event => {
    event.preventDefault();
    button.disabled = true;
    error.hidden = true;
    let html;
    try {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password.value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", iterations: payload.iterations, salt: decode(payload.salt) },
        material, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
      );
      html = await decrypt(key);
      forget();
      if (remember.checked) {
        try {
          const raw = encode(await crypto.subtle.exportKey("raw", key));
          localStorage.setItem(storageKey, JSON.stringify({ salt: payload.salt, key: raw }));
        } catch {}
      }
    } catch {
      error.hidden = false;
      password.focus();
    } finally {
      password.value = "";
      button.disabled = false;
    }
    if (html !== undefined) open(html);
  });
  (async () => {
    button.disabled = true;
    let html;
    try {
      const stored = JSON.parse(localStorage.getItem(storageKey));
      if (stored && stored.salt === payload.salt) {
        const raw = decode(stored.key);
        if (raw.length !== 32) throw new Error("Invalid key");
        const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
        html = await decrypt(key);
      } else if (stored) {
        forget();
      }
    } catch { forget(); }
    finally { button.disabled = false; }
    if (html !== undefined) open(html);
  })();
})();
</script>

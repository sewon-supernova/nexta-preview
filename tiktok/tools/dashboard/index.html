<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
:root {
  /* NEXTA site world (same as nexta.ltd and the calculator): white, ink, thin lines, one red. */
  --ink: #242625; --sub: #606461; --faint: #8f918d; --line: #deded9;
  --bg: #fff; --card: #fff; --gray: #f4f4f2; --soft: #f4f4f2;
  --accent: #d63c2d; --focus: #ad3025;
  --emerald: #242625; --skyc: #f4f4f2; --pinkc: #d63c2d;
  --sage: #f4f4f2; --rose: #fbeae7; --sky: #f4f4f2;
  --ok-ink: #242625; --ng-ink: #ad3025; --sat: #2f5d86; --sun: #d63c2d;
  --line-green: #06c755;
  --radius: 0px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color-scheme: light; }
body {
  font-family: 'Manrope', 'Noto Sans JP', sans-serif;
  color: var(--ink); font-size: 14px; line-height: 1.7; font-weight: 500;
  letter-spacing: 0; font-variant-numeric: tabular-nums; line-break: strict; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
::selection { background: #f6b2a9; color: var(--ink); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.topbar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.lockup { display: inline-flex; flex-direction: column; align-items: center; }
.logo { display: block; width: 74px; height: auto; }
.tagline { display: block; margin-top: 1px; font-family: Arial, sans-serif; font-size: 5px; letter-spacing: .045em; white-space: nowrap; color: #142e38; }
.top-title { font-size: 13px; font-weight: 700; color: var(--ink); }
h1, h2 { font-family: 'Noto Sans JP', sans-serif; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 24px; font-weight: 800; line-height: 1.5; }
h2 { font-size: 16px; font-weight: 700; }
.sub { color: var(--sub); font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); padding: 18px; }
.stack > * + * { margin-top: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 16px; border-radius: 0; border: 1px solid var(--ink);
  background: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; text-decoration: none; transition: background .15s, color .15s;
}
.btn:hover { background: var(--soft); }
a.btn { color: var(--ink); }
.btn:active { background: var(--gray); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover, .btn.primary:active { background: var(--focus); border-color: var(--focus); }
.btn.line { background: var(--line-green); border-color: var(--line-green); color: #fff; }
.btn.line:active { background: #05a648; }
.btn.primary[disabled] { background: var(--faint); border-color: var(--faint); }
.btn.small { height: 36px; padding: 0 12px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--sub); }
.pill { display: inline-block; padding: 1px 8px; border: 1px solid currentColor; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--sage); color: var(--ok-ink); }
.pill.ng { background: var(--rose); color: var(--ng-ink); }
.pill.off { background: var(--gray); color: var(--sub); }
select, input[type=text], input[type=password], textarea {
  border: 1px solid var(--line); border-radius: 0; background: #fff; padding: 10px 12px; font-size: 16px; width: 100%; min-height: 48px;
}
select { -webkit-appearance: none; appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
textarea { min-height: 84px; resize: vertical; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: #d9dad6; border-radius: 999px; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.18); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.notice { border: 1px solid var(--accent); color: var(--focus); padding: 12px 14px; font-size: 13px; }
.hint { background: var(--soft); color: var(--ink); padding: 12px 14px; font-size: 13px; }
.center { text-align: center; }
.muted { color: var(--sub); }
.loading { padding: 80px 0; text-align: center; color: var(--sub); font-size: 14px; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: #fff; padding: 10px 16px; font-size: 13px; font-weight: 700;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

<style>

.empty { padding: 28px 0; text-align: center; color: var(--sub); font-size: 13px; }
.list { border-top: 1px solid var(--line); }

.liver-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; cursor: pointer; }

.mini { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); margin-top: 12px; }
.mini span { padding: 4px 0; text-align: center; font-size: 10px; line-height: 1.35; color: var(--faint); }
.mini span + span { border-left: 1px solid var(--line); }
.mini span b { display: block; font-size: 12px; color: inherit; }

.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.detail { margin-top: 12px; padding-top: 4px; font-size: 13px; }
.detail div { display: flex; gap: 10px; padding: 6px 0; align-items: flex-start; border-top: 1px dashed var(--line); }

.section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 26px 0 10px; }

.mrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: none; }
.edit { padding: 12px 0; border-top: 1px solid var(--line); }
.edit label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin: 8px 0 4px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.calc-frame { display: block; width: 100%; border: none; min-height: 600px; margin-top: 16px; }

.legend i.self { background: #fff; border: 1.5px solid var(--ink); }
.foot { height: 48px; }
</style>

function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.setAttribute('style', v);
    else if (k === 'value') el.value = v;
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
  el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    r[name].apply(r, args);
  });
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function hm(m) { var hh = Math.floor(m / 60); return (hh >= 24 ? '翌' : '') + pad2(hh % 24) + ':' + pad2(m % 60); }
function hoursText(min) {
  var hh = Math.floor(min / 60), mm = min % 60;
  return mm ? hh + '時間' + mm + '分' : hh + '時間';
}
function md(ymd) { var p = ymd.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function weekLabel(dates) { return md(dates[0]) + '(月)〜' + md(dates[6]) + '(日)'; }
function addDays(ymd, n) {
  var d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function errCode(err) { var m = String(err && err.message || err); var k = m.match(/[A-Z_]{4,}/); return k ? k[0] : m; }
var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
}
function copyText(text) {
  function fallback() {
    var ta = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = text; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
  }
  return Promise.resolve(fallback());
}

<script>
var S = { data: null, week: '', tab: window.__TAB || ({ '#calc': 'calc', '#livers': 'livers', '#manage': 'manage' })[location.hash] || 'day', day: 0, open: {}, editing: null, busy: false };
var app = document.getElementById('app');

function activeLivers() { return S.data.livers.filter(function (l) { return l.active; }); }
function sumMinutes(list) { return list.reduce(function (a, r) { return a + r.e - r.s; }, 0); }
function onDay(l, date) { return l.streams.filter(function (r) { return r.date === date; }); }
function shortHours(min) { var v = Math.round(min / 6) / 10; return (v % 1 ? v.toFixed(1) : String(v)) + 'h'; }
function dow(ymd) { return (new Date(ymd + 'T00:00:00Z').getUTCDay() + 6) % 7; }
function withStreams() { return S.data.livers.filter(function (l) { return l.streams.length; }); }
function dia(list) { return list.reduce(function (a, r) { return a + Number(r.stats && r.stats.diamonds || 0); }, 0); }
function num(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function shortNum(n) { return n >= 100000 ? Math.round(n / 1000) + 'K' : num(n); }
function diaText(r) { return r.source === 'backstage' ? 'ダイヤ ' + num(Number(r.stats && r.stats.diamonds || 0)) : '手入力'; }

function load(week) {
  call('adminGetWeek', week || '').then(function (data) {
    S.data = data; S.week = data.week;
    var ti = data.dates.indexOf(data.today);
    if (S.dayWeek !== data.week) {
      // Open on today, or on the latest day that has records.
      var pick = ti >= 0 ? ti : 6;
      var has = function (i) { return data.livers.some(function (l) { return l.streams.some(function (r) { return r.date === data.dates[i]; }); }); };
      for (var i = pick; i >= 0; i--) { if (has(i)) { pick = i; break; } }
      S.day = pick; S.dayWeek = data.week;
    }
    render();
  }, function (err) {
    var code = errCode(err);
    app.replaceChildren(h('div', { class: 'wrap', style: 'padding:32px 16px' }, h('div', { class: 'notice',
      text: code === 'FORBIDDEN' ? 'このページは管理者だけが見られます。info@nexta.ltd でログインしてください。' : '読み込みに失敗しました。ページを開き直してください。' })));
  });
}

function weekRel(week) {
  var diff = Math.round((new Date(week) - new Date(S.data.thisWeek)) / 864e5 / 7);
  return diff === 0 ? '今週' : diff === -1 ? '先週' : diff > 0 ? diff + '週間後' : (-diff) + '週間前';
}

function render() {
  var d = S.data;
  var live = withStreams();
  var all = [].concat.apply([], live.map(function (l) { return l.streams; }));
  var isThisWeek = d.week === d.thisWeek;
  var tabs = [['day', '日別'], ['livers', 'ライバー'], ['calc', '計算機'], ['manage', '管理']];
  var tabBar = h('nav', { class: 'tabs', role: 'tablist' }, h('div', { class: 'wrap' }, tabs.map(function (t) {
    return h('button', { type: 'button', role: 'tab', 'aria-selected': S.tab === t[0] ? 'true' : 'false', class: S.tab === t[0] ? 'on' : '', text: t[1],
      onclick: function () { S.tab = t[0]; render(); window.scrollTo(0, 0); } });
  })));
  var week = S.tab === 'day' || S.tab === 'livers' ? [
    h('div', { class: 'weeknav' },
      h('div', { class: 'label' }, h('span', { class: 'sub', text: weekRel(d.week) }), h('b', { text: weekLabel(d.dates) })),
      h('div', { class: 'nav' },
        h('button', { type: 'button', 'aria-label': '前の週', text: '‹', onclick: function () { load(addDays(S.week, -7)); } }),
        h('button', { type: 'button', 'aria-label': '次の週', text: '›', disabled: isThisWeek, onclick: function () { if (!isThisWeek) load(addDays(S.week, 7)); } }))),
    h('div', { class: 'kpis' },
      h('div', { class: 'kpi' }, h('div', { class: 'k', text: '配信した人' }), h('div', { class: 'v' }, String(live.length), h('small', { text: '/ ' + activeLivers().length + '人' }))),
      h('div', { class: 'kpi' }, h('div', { class: 'k', text: '配信時間' }), h('div', { class: 'v' }, shortHours(sumMinutes(all)).replace('h', ''), h('small', { text: '時間・' + all.length + '回' }))),
      h('div', { class: 'kpi k3' }, h('div', { class: 'k', text: 'ダイヤ' }), h('div', { class: 'v', text: shortNum(dia(all)) })))
  ] : null;
  var body = S.tab === 'day' ? renderDayTab() : S.tab === 'livers' ? renderLiversTab() : S.tab === 'calc' ? renderCalcTab() : renderManageTab();
  var root = h('div', null, tabBar, h('div', { class: 'wrap' }, week, body, h('div', { class: 'foot' })));
  app.replaceChildren(root);
}

/* ---- day tab ---- */
function renderDayTab() {
  var d = S.data;
  var date = d.dates[S.day];
  var chips = h('div', { class: 'days' }, d.dates.map(function (dt, i) {
    var n = d.livers.filter(function (l) { return onDay(l, dt).length; }).length;
    var future = dt > d.today;
    return h('button', { type: 'button', class: (S.day === i ? 'on' : '') + (dt === d.today ? ' today' : '') + (i === 5 ? ' sat' : i === 6 ? ' sun' : ''),
      disabled: future, style: future ? 'opacity:.35' : null, onclick: function () { S.day = i; render(); } },
      h('span', { class: 'w', text: DAY_JA[i] }), h('span', { class: 'n', text: String(Number(dt.slice(8))) }), h('span', { class: 'c', text: future ? '' : n + '人' }));
  }));
  var rows = d.livers.filter(function (l) { return onDay(l, date).length; })
    .sort(function (a, b) { return onDay(a, date)[0].s - onDay(b, date)[0].s; });
  var card = h('div', { class: 'card' });
  if (!rows.length) {
    card.appendChild(h('div', { class: 'empty', text: 'この日の配信記録はまだありません。' }));
    return [chips, card];
  }
  var lo = Infinity, hi = -Infinity;
  rows.forEach(function (l) { onDay(l, date).forEach(function (r) { lo = Math.min(lo, r.s); hi = Math.max(hi, r.e); }); });
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  while (hi - lo < 360) { if (lo >= 60) lo -= 60; else hi += 60; }
  var span = hi - lo;
  var pct = function (m) { return ((m - lo) / span * 100) + '%'; };
  var step = span > 720 ? 180 : span > 480 ? 120 : 60;
  var ticks = h('div', { class: 'ticks' });
  for (var t = lo; t <= hi; t += step) ticks.appendChild(h('span', { style: 'left:' + pct(t), text: (t / 60 >= 24 ? '翌' : '') + (t / 60 % 24) + '時' }));
  var bins = [], peak = 0, peakAt = lo;
  for (var m = lo; m < hi; m += 15) {
    var c = rows.filter(function (l) { return onDay(l, date).some(function (r) { return r.s < m + 15 && r.e > m; }); }).length;
    bins.push(c); if (c > peak) { peak = c; peakAt = m; }
  }
  var cov = h('div', { class: 'cov' }, bins.map(function (c) {
    var a = c ? 0.15 + 0.85 * c / peak : 0.05;
    return h('i', { style: 'background:rgba(36,38,37,' + (c ? a : 0.06).toFixed(2) + ')' });
  }));
  var hw = (60 / span * 100) + '%';
  var dayList = [].concat.apply([], rows.map(function (l) { return onDay(l, date); }));
  card.appendChild(h('div', { class: 'tl-head' }, h('h2', { text: md(date) + '（' + DAY_JA[S.day] + '）' }),
    h('span', { class: 'sub', text: rows.length + '人・' + hoursText(sumMinutes(dayList)) + (dia(dayList) ? '・ダイヤ ' + num(dia(dayList)) : '') })));
  card.appendChild(h('div', { class: 'axis' }, h('span'), ticks));
  card.appendChild(h('div', { class: 'axis', style: 'margin-bottom:6px' }, h('span', { class: 'sub', style: 'font-size:11px', text: '同時に配信中' }), cov));
  rows.forEach(function (l) {
    var rs = onDay(l, date);
    var track = h('div', { class: 'track', style: '--hw:calc(' + hw + ')' }, rs.map(function (r) {
      return h('b', { class: r.source === 'backstage' ? '' : 'self', title: hm(r.s) + '〜' + hm(r.e), style: 'left:' + pct(r.s) + ';width:calc(' + pct(r.e) + ' - ' + pct(r.s) + ')' });
    }));
    card.appendChild(h('div', { class: 'tl-row' },
      h('div', { class: 'tl-name' }, l.name, rs.map(function (r) { return h('small', { text: hm(r.s) + '〜' + hm(r.e) }); }), dia(rs) ? h('small', { text: 'ダイヤ ' + num(dia(rs)) }) : null),
      track));
  });
  var memos = [];
  rows.forEach(function (l) { onDay(l, date).forEach(function (r) { if (r.memo) memos.push([l.name, r.memo]); }); });
  var legend = h('div', { class: 'legend' }, h('span', null, h('i'), 'Backstage'), h('span', null, h('i', { class: 'self' }), 'ライバーの手入力'));
  return [chips, card, legend, memos.length ? h('div', { class: 'card', style: 'margin-top:10px' },
    h('h2', { style: 'font-size:15px;margin-bottom:6px', text: 'メモ' }),
    memos.map(function (x) { return h('div', { class: 'detail', style: 'border:none;margin:0;padding:4px 0' }, h('div', null, h('span', { text: x[0] }), h('span', { text: x[1] }))); })) : null];
}

/* ---- livers tab ---- */
function lineMessage(l) {
  return l.name + 'さん、お疲れさまです！NEXTAです。\n配信が終わったら、こちらから配信した時間を記録してください。このリンクはずっと使えます。\n' + l.link;
}
function renderLiversTab() {
  var act = activeLivers();
  if (!S.data.formUrl) return h('div', { class: 'notice', text: 'フォームのURLがまだ設定されていません。「管理」タブで設定してください。' });
  if (!act.length) return h('div', { class: 'card empty', text: 'ライバーがまだいません。「管理」タブから追加してください。' });
  var live = act.filter(function (l) { return l.streams.length; }).sort(function (a, b) { return sumMinutes(b.streams) - sumMinutes(a.streams); });
  var none = act.filter(function (l) { return !l.streams.length; });
  return [
    live.length ? h('div', { class: 'section-title' }, h('h2', { text: 'この週に配信した人 ' + live.length + '人' })) : null,
    live.length ? h('div', { class: 'list' }, live.map(liverCard)) : null,
    none.length ? h('div', { class: 'section-title' }, h('h2', { text: 'この週の記録なし ' + none.length + '人' })) : null,
    none.length ? h('div', { class: 'list' }, none.map(liverCard)) : null
  ];
}
function liverCard(l) {
  var open = !!S.open[l.id];
  var total = sumMinutes(l.streams);
  var has = l.streams.length > 0;
  return h('div', { class: 'liver' },
    h('div', { class: 'liver-top', onclick: function () { S.open[l.id] = !open; render(); } },
      h('div', null,
        h('div', { class: 'liver-name' }, l.name),
        h('div', { class: 'liver-meta', text: [l.tiktok ? '@' + l.tiktok : '', l.lastDate ? '最終 ' + md(l.lastDate) : '記録なし'].filter(Boolean).join('　') })),
      h('div', { class: 'liver-hours' }, has ? hoursText(total) : '', has ? h('small', null, l.streams.length + '回', dia(l.streams) ? ['・ダイヤ ', h('b', { text: num(dia(l.streams)) })] : null) : null)),
    has ? h('div', { class: 'mini' }, S.data.dates.map(function (date, i) {
      var mins = sumMinutes(onDay(l, date));
      return h('span', { class: mins ? 'has' : '' }, DAY_JA[i], h('b', { text: mins ? shortHours(mins) : '-' }));
    })) : null,
    open ? h('div', { class: 'detail' },
      has ? l.streams.map(function (r) {
        return h('div', null, h('span', { text: md(r.date) + ' ' + DAY_JA[dow(r.date)] }),
          h('span', { style: 'flex:1' }, hm(r.s) + '〜' + hm(r.e) + '（' + hoursText(r.e - r.s) + '）', h('small', { class: 'sub', style: 'display:block', text: diaText(r) + (r.stats && r.stats.viewers ? '・視聴者' + num(r.stats.viewers) + '人' : '') + (r.memo ? '・' + r.memo : '') })),
          h('button', { type: 'button', class: 'btn small ghost', style: 'height:24px;padding:0 4px;color:var(--ng-ink)', text: '削除', onclick: function () {
            if (!confirm(l.name + 'さんの ' + md(r.date) + ' ' + hm(r.s) + '〜' + hm(r.e) + ' の記録を削除しますか？カレンダーからも消えます。')) return;
            mutate(function () { return call('adminDeleteStream', r.id); }, '削除しました');
          } }));
      }) : h('div', { class: 'sub', text: 'この週の記録はありません。' }),
      h('div', { class: 'actions', style: 'margin-top:10px' },
        h('button', { type: 'button', class: 'btn small', text: 'リンクをコピー', onclick: function () {
          copyText(l.link).then(function (ok) { toast(ok ? 'コピーしました' : 'コピーできませんでした'); });
        } }),
        h('a', { class: 'btn small line', href: 'https://line.me/R/msg/text/?' + encodeURIComponent(lineMessage(l)), target: '_blank', rel: 'noopener', text: 'LINEでリンクを送る' }))) : null
  );
}

/* ---- calculator tab ---- */
// The TikTok business calculator (same as the old nexta.ltd/tools/tiktok/), loaded from the
// server only after login and shown in a same-origin iframe that grows with its content.
function renderCalcTab() {
  var frame = h('iframe', { class: 'calc-frame', title: 'TikTok 事業収益計算機' });
  var box = h('div', null, frame);
  var fit = function () {
    try { var b = frame.contentDocument.documentElement; frame.style.height = b.scrollHeight + 'px'; } catch (e) {}
  };
  var show = function (html) {
    frame.srcdoc = html;
    frame.onload = function () {
      fit();
      try { new ResizeObserver(fit).observe(frame.contentDocument.body); } catch (e) { setInterval(fit, 1000); }
    };
  };
  if (S.calcHtml) show(S.calcHtml);
  else {
    box.insertBefore(h('div', { class: 'loading', text: '読み込み中…' }), frame);
    call('adminGetCalculator').then(function (html) {
      S.calcHtml = html;
      if (box.firstChild && box.firstChild.className === 'loading') box.removeChild(box.firstChild);
      show(html);
    }, function () { toast('計算機を読み込めませんでした'); });
  }
  return box;
}

/* ---- manage tab ---- */
function mutate(fn, okMsg) {
  if (S.busy) return;
  S.busy = true;
  fn().then(function () { S.busy = false; S.editing = null; toast(okMsg); load(S.week); },
    function (err) { S.busy = false; toast('保存できませんでした（' + errCode(err) + '）'); });
}
function renderManageTab() {
  var d = S.data;
  var ta = h('textarea', { placeholder: '1行に1人。名前, TikTok ID\n例：さくら, sakura_live' });
  var list = h('div', { class: 'card' });
  if (!d.livers.length) list.appendChild(h('div', { class: 'empty', text: 'まだ登録がありません。' }));
  d.livers.forEach(function (l) {
    if (S.editing === l.id) { list.appendChild(editRow(l)); return; }
    list.appendChild(h('div', { class: 'mrow' },
      h('div', null, h('div', { style: 'font-weight:700' }, l.name, ' ', l.active ? null : h('span', { class: 'pill off', text: '停止中' })),
        h('div', { class: 'sub', text: (l.tiktok ? '@' + l.tiktok : 'TikTok ID 未登録') + (l.note ? '　' + l.note : '') })),
      h('button', { type: 'button', class: 'btn small', text: '編集', onclick: function () { S.editing = l.id; render(); } })));
  });
  var act = activeLivers();
  var urlInput = h('input', { type: 'text', placeholder: 'https://script.google.com/macros/s/…/exec', value: d.formUrl || '' });
  return [
    h('div', { class: 'card stack' },
      h('h2', { style: 'font-size:15px', text: 'ライバーを追加' }),
      ta,
      h('button', { type: 'button', class: 'btn primary', style: 'width:100%', text: '追加する', onclick: function () {
        if (!ta.value.trim()) return toast('名前を入れてください');
        mutate(function () { return call('adminAddLivers', ta.value); }, '追加しました');
      } })),
    h('div', { class: 'section-title' }, h('h2', { text: '登録中のライバー ' + d.livers.length + '人' }),
      act.length && d.formUrl ? h('button', { type: 'button', class: 'btn small', text: '全員のリンクをコピー', onclick: function () {
        var text = act.map(function (l) { return l.name + 'さん\n' + l.link; }).join('\n\n');
        copyText(text).then(function (ok) { toast(ok ? act.length + '人分をコピーしました' : 'コピーできませんでした'); });
      } }) : null),
    list,
    h('div', { class: 'section-title' }, h('h2', { text: 'カレンダーとデータ' })),
    h('div', { class: 'card stack' },
      h('p', { class: 'sub', style: 'margin:0', text: 'TikTok LIVE Backstage の配信とライバーの手入力が、Google カレンダー「NEXTA 配信記録」に自動で入ります。info@nexta.ltd の Google カレンダーアプリでも見られます。' }),
      h('div', { class: 'row-btns', style: 'margin:0' },
        h('a', { class: 'btn small', href: d.calendarUrl, target: '_blank', rel: 'noopener', text: 'カレンダーを開く' }),
        h('a', { class: 'btn small', href: d.sheetUrl, target: '_blank', rel: 'noopener', text: 'スプレッドシートを開く' }))),
    h('div', { class: 'section-title' }, h('h2', { text: 'フォームのURL' })),
    h('div', { class: 'card stack' },
      d.formUrl ? h('p', { class: 'sub', style: 'margin:0;word-break:break-all', text: d.formUrl }) : h('div', { class: 'notice', text: 'まだ設定されていません。' }),
      urlInput,
      h('button', { type: 'button', class: 'btn small', text: 'URLを保存', onclick: function () {
        mutate(function () { return call('adminSetFormUrl', urlInput.value); }, '保存しました');
      } })),
    window.nextaLogout ? h('div', { style: 'margin-top:28px' }, h('button', { type: 'button', class: 'btn small', text: 'ログアウト', onclick: function () { window.nextaLogout(); } })) : null
  ];
}
function editRow(l) {
  var name = h('input', { type: 'text', value: l.name, maxlength: 40 });
  var tiktok = h('input', { type: 'text', value: l.tiktok, maxlength: 40, placeholder: 'sakura_live' });
  var note = h('input', { type: 'text', value: l.note, maxlength: 200, placeholder: '担当や事務所など（任意）' });
  return h('div', { class: 'edit' },
    h('label', { text: '名前' }), name,
    h('label', { text: 'TikTok ID' }), tiktok,
    h('label', { text: 'メモ' }), note,
    h('div', { class: 'row-btns' },
      h('button', { type: 'button', class: 'btn small primary', text: '保存', onclick: function () {
        mutate(function () { return call('adminUpdateLiver', l.id, { name: name.value, tiktok: tiktok.value, note: note.value }); }, '保存しました');
      } }),
      h('button', { type: 'button', class: 'btn small', text: l.active ? '停止する' : '再開する', onclick: function () {
        mutate(function () { return call('adminUpdateLiver', l.id, { active: !l.active }); }, l.active ? '停止しました' : '再開しました');
      } }),
      h('button', { type: 'button', class: 'btn small', text: 'リンクを作り直す', onclick: function () {
        if (!confirm(l.name + 'さんのリンクを作り直しますか？前のリンクは使えなくなります。')) return;
        mutate(function () { return call('adminUpdateLiver', l.id, { regenerate: true }); }, '新しいリンクにしました');
      } }),
      h('button', { type: 'button', class: 'btn small ghost', text: 'キャンセル', onclick: function () { S.editing = null; render(); } })));
}

load('');
</script>
